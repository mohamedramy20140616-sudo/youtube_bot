<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Bot</title>
<style>
body {
  background: #101522;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 30px;
}
.container {
  background: #202b40;
  padding: 25px;
  border-radius: 15px;
  max-width: 500px;
  margin: auto;
}
input, textarea, button {
  width: 90%;
  padding: 12px;
  margin: 10px;
  border-radius: 8px;
  border: none;
}
button {
  background: #e62117;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>
<body>
<div class="container">
<h1>🤖 YouTube Bot</h1>
<p>لوحة التحكم الخاصة بك</p>

<input id="video" placeholder="رابط فيديو YouTube">

<textarea id="comment" rows="5">يا جيسك ❤️ أنا متابعك من زمان، ونفسي جدًا أكسب المسابقة دي. حلمي أكسب باكيج أرسنال، خصوصًا إنه فيه الأسطورة تييري هنري واللاعبين اللي معاه. يا رب أكون أنا الفائز المرة دي ❤️🔥⚽</textarea>

<button onclick="copyComment()">نسخ التعليق</button>
<p id="status"></p>
</div>

<script>
function copyComment() {
  navigator.clipboard.writeText(
    document.getElementById("comment").value
  ).then(() => {
    document.getElementById("status").textContent =
      "تم نسخ التعليق بنجاح!";
  });
}
</script>
</body>
</html>
